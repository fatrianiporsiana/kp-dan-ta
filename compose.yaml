services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: kp-ta-app

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - kp-ta-network


  nginx:
    image: nginx:alpine

    container_name: kp-ta-nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - kp-ta-network


  mysql:
    image: mysql:8.4

    container_name: kp-ta-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -proot123
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - kp-ta-network


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kp-ta-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - kp-ta-network


networks:
  kp-ta-network:
    driver: bridge


volumes:
  mysql_data:
  vendor_data: